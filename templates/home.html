<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep Thoughts</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <header>
        <h1 class="site-title">Keep Thoughts</h1>
    </header>
    <main id="main">
        <section id="thoughtsList" class="thoughts-list">
            <div class="empty-list">
                <p>You haven't added any thoughts yet.</p>
                <ul>
                    <li>Press the Add Thought button below to add your first thought.</li>
                </ul>
            </div>
            <div class="loaded-list">
                <h2>My Thoughts</h2>
                <hr>
                <div class="thought-cards"></div>
            </div>
            <button id="backBtn" class="back-btn">
                <span class="back-icon">←</span>
                <span class="back-text">Back</span>
            </button>
        </section>
        <section id="action" class="actions">
            <div class="action-tools">
                <button id="addThoughtBtn" class="add-thought-button">
                    <span class="add-icon">+</span>
                    <span class="add-text">Add Thought</span>
                </button>
            </div>
            <div class="write-section">
                <input type="text" placeholder="Title" id="titleInput" class="title-input">
                <hr>
                <textarea placeholder="Write your thought here..." id="contentInput" class="content-input"></textarea>
                <button id="clrBtn" class="clr-btn">Clear</button>
                <button id="saveThoughtBtn" class="save-thought-button">Save Thought</button>
            </div>
        </section>
    </main>
    <div id="clearPopup" class="confirm-overlay">
        <div id="popupBox" class="confirm-box">
            <h2>Clear Thoughts?</h2>
            <p>Are you sure you want to clear the thoughts?</p>
            <div class="confirm-actions">
                <button id="cancelBtn" class="cancel-btn">Cancel</button>
                <button id="confirmClear" class="confirm-clear">Clear</button>
            </div>
        </div>
    </div>

    <div id="savePopup" class="save-popup">
        <div class="save-popup-box">
            <p>Thought Saved.</p>
        </div>
    </div>

    <div id="emptyContent" class="no-content">
        <div class="no-content-popup" id="noContentBox">
            <p> Title/Contents can't be empty.</p>
            <button id="emptyContentBoxButton">Ok</button>
        </div>
    </div>
</body>
<script src="/static/js/scripts.js"></script>

</html>
